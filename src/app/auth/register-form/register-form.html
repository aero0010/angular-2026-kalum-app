<div class="login-container">
    <mat-card-title style="text-align: center; color: #303F9F;">
        <img src="images/logotipo.png" alt="Kalum App">
    </mat-card-title>
    <mat-card class="login-card">
        <form [formGroup]="registerForm">
            <mat-form-field appearance="fill" class="full-width">
                <mat-label>Lastname</mat-label>
                <input matInput formControlName="lastname">
            </mat-form-field>
            <mat-form-field appearance="fill" class="full-width">
                <mat-label>Firstname</mat-label>
                <input matInput formControlName="firstname">
            </mat-form-field>
            <mat-form-field appearance="fill" class="full-width">
                <mat-label>Username</mat-label>
                <input matInput formControlName="username">
            </mat-form-field>
            <mat-form-field appearance="fill" class="full-width">
                <mat-label>Password</mat-label>
                <input matInput type="password" formControlName="password">
            </mat-form-field>
            <mat-form-field appearance="fill" class="full-width">
                <mat-label>Email</mat-label>
                <input matInput type="email" formControlName="email">
            </mat-form-field>
            <button mat-raised-button color="primary" type="submit" (click)="onSave()">
                Save
            </button>
            <button mat-raised-button color="primary" (click)="onCancel()">
                Cancel
            </button>
        </form>
    </mat-card>
</div>
